<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Happy Mother's Day!</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5d9dd;
      font-family: 'Caveat', cursive;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      user-select: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .screen.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ── SCREEN 1 ── */
    #s1 .question {
      color: #e03c6a;
      font-size: clamp(52px, 10vw, 88px);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      padding: 0 2rem;
      letter-spacing: 2px;
    }
    #s1 .question span {
      display: block;
    }
    #s1 .hint {
      margin-top: 2.5rem;
      color: #e03c6a;
      font-size: clamp(18px, 3.5vw, 26px);
      opacity: 0.55;
      letter-spacing: 1px;
      animation: pulse 2s ease-in-out infinite;
    }

    /* ── SCREEN 2 ── */
    #s2 .answer {
      color: #e03c6a;
      font-size: clamp(52px, 10vw, 88px);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      padding: 0 2rem;
      letter-spacing: 2px;
    }
    #s2 .answer span { display: block; }
    #s2 .sub {
      margin-top: 2.5rem;
      color: #e03c6a;
      font-size: clamp(18px, 3.5vw, 26px);
      opacity: 0.55;
      letter-spacing: 1px;
      animation: pulse 2s ease-in-out infinite;
    }

    /* ── SCREEN 3 (heart game) ── */
    #s3 {
      gap: 0;
    }
    #s3 .prompt {
      color: #e03c6a;
      font-size: clamp(22px, 4.5vw, 36px);
      opacity: 0.7;
      letter-spacing: 1px;
      margin-bottom: 2rem;
      transition: opacity 0.4s;
    }
    #heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }
    #heart-btn:active { transform: scale(0.88) !important; }
    #heart-svg {
      filter: drop-shadow(0 6px 24px rgba(224,60,106,0.22));
      transition: filter 0.3s;
    }
    #heart-btn:hover #heart-svg {
      filter: drop-shadow(0 8px 32px rgba(224,60,106,0.38));
    }
    .tap-count {
      margin-top: 1.8rem;
      color: #e03c6a;
      font-size: clamp(20px, 4vw, 32px);
      opacity: 0.55;
      letter-spacing: 1px;
      min-height: 1.5em;
    }

    /* ── SCREEN 4 (celebration) ── */
    #s4 .big-msg {
      color: #e03c6a;
      font-size: clamp(48px, 11vw, 108px);
      font-weight: 700;
      text-align: center;
      line-height: 1.1;
      letter-spacing: 3px;
      padding: 0 1.5rem;
      animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
      position: relative;
      z-index: 2;
    }
    #s4 .big-msg span { display: block; }

    /* flowers */
    .flower {
      position: absolute;
      transform-origin: 50% 100%;
      opacity: 0;
      pointer-events: none;
    }
    #s4.active .flower {
      animation:
        growIn 0.6s cubic-bezier(0.34,1.56,0.64,1) var(--grow-delay,0s) both,
        sway var(--sway-dur, 2.4s) calc(var(--grow-delay,0s) + 0.6s) ease-in-out infinite var(--sway-dir, alternate);
    }
    /* positions */
    .fl1  { bottom: 2vh;  left:  2vw;  --sway-dur:2.2s; --sway-delay:0.8s;  --grow-delay:0.3s; --sway-dir:alternate; }
    .fl2  { bottom: 0vh;  left: 14vw;  --sway-dur:2.6s; --sway-delay:0.2s;  --grow-delay:0.5s; --sway-dir:alternate-reverse; }
    .fl3  { bottom: 0vh;  left: 28vw;  --sway-dur:2.0s; --sway-delay:0.9s;  --grow-delay:0.7s; --sway-dir:alternate; }
    .fl4  { bottom: 0vh;  right:28vw;  --sway-dur:2.5s; --sway-delay:0.4s;  --grow-delay:0.4s; --sway-dir:alternate-reverse; }
    .fl5  { bottom: 0vh;  right:14vw;  --sway-dur:2.1s; --sway-delay:0.7s;  --grow-delay:0.6s; --sway-dir:alternate; }
    .fl6  { bottom: 2vh;  right: 2vw;  --sway-dur:2.7s; --sway-delay:0.1s;  --grow-delay:0.2s; --sway-dir:alternate-reverse; }
    .fl7  { bottom: 10vh; left: -1vw;  --sway-dur:2.3s; --sway-delay:0.5s;  --grow-delay:0.9s; --sway-dir:alternate; }
    .fl8  { bottom: 10vh; right:-1vw;  --sway-dur:2.4s; --sway-delay:0.3s;  --grow-delay:1.1s; --sway-dir:alternate-reverse; }


    canvas#confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* ── ANIMATIONS ── */
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.75; }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.4) rotate(-4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes heartBeat {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      70% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }
    @keyframes growIn {
      0%   { opacity: 0; transform: scaleY(0) rotate(0deg); }
      100% { opacity: 1; transform: scaleY(1) rotate(0deg); }
    }
    @keyframes sway {
      0%   { transform: rotate(-12deg); }
      100% { transform: rotate(12deg); }
    }
  </style>
</head>
<body>

<!-- SCREEN 1: question -->
<section class="screen active" id="s1">
  <p class="question">
    <span>what day</span>
    <span>is it???</span>
  </p>
  <p class="hint">tap to find out</p>
</section>

<!-- SCREEN 2: reveal -->
<section class="screen" id="s2">
  <p class="answer">
    <span>it's</span>
    <span>mother's</span>
    <span>day :D</span>
  </p>
  <p class="sub">now tap the heart...</p>
</section>

<!-- SCREEN 3: heart game -->
<section class="screen" id="s3">
  <p class="prompt" id="prompt-txt">give it some love ♥</p>
  <button id="heart-btn" aria-label="Tap the heart">
    <svg id="heart-svg" xmlns="http://www.w3.org/2000/svg"
         width="120" height="110" viewBox="0 0 120 110">
      <path id="heart-path"
        d="M60 95 C60 95 10 62 10 32 C10 16 22 6 36 6 C46 6 55 12 60 20 C65 12 74 6 84 6 C98 6 110 16 110 32 C110 62 60 95 60 95 Z"
        fill="#e03c6a"/>
    </svg>
  </button>
  <p class="tap-count" id="tap-count"></p>
</section>

<!-- SCREEN 4: celebration -->
<section class="screen" id="s4">
  <p class="big-msg">
    <span>happy</span>
    <span>mother's</span>
    <span>day :D</span>
  </p>
  <p class="sub" style="margin-top: 1.5rem; opacity: 0.75; font-size: clamp(22px, 4.5vw, 38px); animation: pulse 2s ease-in-out infinite;">Thanks for everything Carmen!</p>

  <!-- flower 1: pink daisy, large -->
  <div class="flower fl1">
    <svg width="80" height="110" viewBox="0 0 80 110" xmlns="http://www.w3.org/2000/svg">

      <ellipse cx="52" cy="72" rx="12" ry="6" fill="#7dc96b" transform="rotate(-30 52 72)"/>
      <g transform="translate(40 44)">
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1"/>
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(45)"/>
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(90)"/>
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(135)"/>
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f9c0d4" transform="rotate(22.5)"/>
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f9c0d4" transform="rotate(67.5)"/>
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f9c0d4" transform="rotate(112.5)"/>
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f9c0d4" transform="rotate(157.5)"/>

  <!-- flower 2: rose-pink tulip, small -->

    <svg width="50" height="90" viewBox="0 0 50 90" xmlns="http://www.w3.org/2000/svg">
      <rect x="22" y="45" width="6" height="45" rx="3" fill="#7dc96b"/>
      <ellipse cx="33" cy="62" rx="10" ry="5" fill="#7dc96b" transform="rotate(-25 33 62)"/>
      <g transform="translate(25 42)">
        <ellipse cx="-8" cy="-16" rx="9" ry="18" fill="#e03c6a" transform="rotate(-20)"/>
        <ellipse cx="8"  cy="-16" rx="9" ry="18" fill="#e03c6a" transform="rotate(20)"/>
        <ellipse cx="0"  cy="-20" rx="8" ry="17" fill="#f06292"/>

  </div>

  <!-- flower 3: purple daisy, medium -->
  <div class="flower fl3">
    <svg width="65" height="100" viewBox="0 0 65 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="48" width="5" height="52" rx="2.5" fill="#7dc96b"/>
      <ellipse cx="43" cy="66" rx="11" ry="5" fill="#7dc96b" transform="rotate(-28 43 66)"/>
      <g transform="translate(32 44)">
        <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#ce93d8"/>
        <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#ce93d8" transform="rotate(40)"/>
        <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#ce93d8" transform="rotate(80)"/>
        <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#ce93d8" transform="rotate(120)"/>
        <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#ba68c8" transform="rotate(20)"/>
        <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#ba68c8" transform="rotate(60)"/>
        <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#ba68c8" transform="rotate(100)"/>
        <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#ba68c8" transform="rotate(140)"/>
        <circle cx="0" cy="0" r="9" fill="#f9e04b"/>
        <circle cx="0" cy="0" r="5" fill="#e8b400"/>
      </g>
    </svg>
  </div>

  <!-- flower 4: yellow sunflower style, medium -->
  <div class="flower fl4">
    <svg width="70" height="105" viewBox="0 0 70 105" xmlns="http://www.w3.org/2000/svg">
      <rect x="32" y="50" width="6" height="55" rx="3" fill="#7dc96b"/>
      <ellipse cx="20" cy="70" rx="12" ry="5" fill="#7dc96b" transform="rotate(28 20 70)"/>
      <g transform="translate(35 46)">
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#fdd835"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#fdd835" transform="rotate(36)"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#fdd835" transform="rotate(72)"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#fdd835" transform="rotate(108)"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#fdd835" transform="rotate(144)"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#f9c00a" transform="rotate(18)"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#f9c00a" transform="rotate(54)"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#f9c00a" transform="rotate(90)"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#f9c00a" transform="rotate(126)"/>
        <ellipse cx="0" cy="-18" rx="7" ry="14" fill="#f9c00a" transform="rotate(162)"/>
        <circle cx="0" cy="0" r="11" fill="#5d4037"/>
        <circle cx="0" cy="0" r="7"  fill="#4e342e"/>
      </g>
    </svg>
  </div>

  <!-- flower 5: hot-pink rose, small -->
  <div class="flower fl5">
    <svg width="50" height="85" viewBox="0 0 50 85" xmlns="http://www.w3.org/2000/svg">
      <rect x="22" y="42" width="6" height="43" rx="3" fill="#7dc96b"/>
      <ellipse cx="14" cy="58" rx="10" ry="5" fill="#7dc96b" transform="rotate(28 14 58)"/>
      <g transform="translate(25 38)">
        <ellipse cx="-8" cy="-14" rx="9" ry="17" fill="#ff4081" transform="rotate(-20)"/>
        <ellipse cx="8"  cy="-14" rx="9" ry="17" fill="#ff4081" transform="rotate(20)"/>
        <ellipse cx="0"  cy="-18" rx="8" ry="16" fill="#f06292"/>
        <ellipse cx="0"  cy="-8"  rx="7" ry="8"  fill="#e91e63" opacity="0.7"/>
      </g>
    </svg>
  </div>

  <!-- flower 6: lavender daisy, large -->
  <div class="flower fl6">
    <svg width="82" height="115" viewBox="0 0 82 115" xmlns="http://www.w3.org/2000/svg">
      <rect x="38" y="52" width="6" height="63" rx="3" fill="#7dc96b"/>
      <ellipse cx="24" cy="76" rx="13" ry="6" fill="#7dc96b" transform="rotate(32 24 76)"/>
      <g transform="translate(41 47)">
        <ellipse cx="0" cy="-20" rx="8" ry="15" fill="#e1bee7"/>
        <ellipse cx="0" cy="-20" rx="8" ry="15" fill="#e1bee7" transform="rotate(45)"/>
        <ellipse cx="0" cy="-20" rx="8" ry="15" fill="#e1bee7" transform="rotate(90)"/>
        <ellipse cx="0" cy="-20" rx="8" ry="15" fill="#e1bee7" transform="rotate(135)"/>
        <ellipse cx="0" cy="-20" rx="8" ry="15" fill="#ce93d8" transform="rotate(22.5)"/>
        <ellipse cx="0" cy="-20" rx="8" ry="15" fill="#ce93d8" transform="rotate(67.5)"/>
        <ellipse cx="0" cy="-20" rx="8" ry="15" fill="#ce93d8" transform="rotate(112.5)"/>
        <ellipse cx="0" cy="-20" rx="8" ry="15" fill="#ce93d8" transform="rotate(157.5)"/>
        <circle cx="0" cy="0" r="11" fill="#f9e04b"/>
        <circle cx="0" cy="0" r="7"  fill="#e8b400"/>
      </g>
    </svg>
  </div>

  <!-- flower 7: tiny pink side-left -->
  <div class="flower fl7">
    <svg width="44" height="78" viewBox="0 0 44 78" xmlns="http://www.w3.org/2000/svg">
      <rect x="19" y="36" width="5" height="42" rx="2.5" fill="#7dc96b"/>
      <g transform="translate(22 32)">
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#f48fb1"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#f48fb1" transform="rotate(60)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#f48fb1" transform="rotate(120)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#f9c0d4" transform="rotate(30)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#f9c0d4" transform="rotate(90)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#f9c0d4" transform="rotate(150)"/>
        <circle cx="0" cy="0" r="7" fill="#f9e04b"/>
        <circle cx="0" cy="0" r="4" fill="#e8b400"/>
      </g>
    </svg>
  </div>

  <!-- flower 8: tiny purple side-right -->
  <div class="flower fl8">
    <svg width="44" height="78" viewBox="0 0 44 78" xmlns="http://www.w3.org/2000/svg">
      <rect x="19" y="36" width="5" height="42" rx="2.5" fill="#7dc96b"/>
      <g transform="translate(22 32)">
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#ce93d8"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#ce93d8" transform="rotate(60)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#ce93d8" transform="rotate(120)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#ba68c8" transform="rotate(30)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#ba68c8" transform="rotate(90)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#ba68c8" transform="rotate(150)"/>
        <circle cx="0" cy="0" r="7" fill="#f9e04b"/>
        <circle cx="0" cy="0" r="4" fill="#e8b400"/>
      </g>
    </svg>
  </div>
</section>

<canvas id="confetti"></canvas>

<script>
  const screens = ['s1','s2','s3','s4'].map(id => document.getElementById(id));

  function goTo(n) {
    screens.forEach((s,i) => {
      s.classList.toggle('active', i === n);
    });
  }

  // S1 → S2 on tap
  screens[0].addEventListener('click', () => goTo(1));

  // S2 → S3 on tap
  screens[1].addEventListener('click', () => goTo(2));

  // ── Heart game ──
  const heartBtn  = document.getElementById('heart-btn');
  const heartSvg  = document.getElementById('heart-svg');
  const tapCount  = document.getElementById('tap-count');
  const promptTxt = document.getElementById('prompt-txt');

  const messages = ['', '...once more!', 'keep going!', 'almost there...', 'one more!', ''];
  const sizes    = [120, 150, 185, 225, 270, 340];
  let taps = 0;

  heartBtn.addEventListener('click', () => {
    if (taps >= 5) return;
    taps++;

    const sz = sizes[taps];
    heartSvg.setAttribute('width',  sz);
    heartSvg.setAttribute('height', Math.round(sz * 110/120));

    // bounce animation
    heartBtn.style.animation = 'none';
    heartBtn.offsetHeight; // reflow
    heartBtn.style.animation = 'heartBeat 0.35s ease';

    if (taps < 5) {
      tapCount.textContent = `${taps} / 5`;
      promptTxt.textContent = messages[taps] || 'give it some love ♥';
    } else {
      // explode!
      setTimeout(() => {
        goTo(3);
        launchConfetti();
      }, 250);
    }
  });

  // ── Confetti ──
  const canvas = document.getElementById('confetti');
  const ctx    = canvas.getContext('2d');
  let particles = [];
  let animId;

  function launchConfetti() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    particles = [];

    const colors = ['#e03c6a','#f7a8bc','#ffccd8','#ff6b9d','#c2185b','#f48fb1','#ffffff'];
    for (let i = 0; i < 160; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        r: Math.random() * 10 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 22,
        vy: (Math.random() - 1.4) * 20,
        gravity: 0.55,
        alpha: 1,
        rot: Math.random() * 360,
        rotV: (Math.random() - 0.5) * 8,
        shape: Math.random() > 0.5 ? 'rect' : 'circle',
        w: Math.random() * 14 + 6,
        h: Math.random() * 8 + 4,
      });
    }
    cancelAnimationFrame(animId);
    drawConfetti();
  }

  function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of particles) {
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.99;
      p.rot+= p.rotV;
      p.alpha -= 0.012;
      if (p.alpha > 0) {
        alive = true;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        if (p.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, p.r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        }
        ctx.restore();
      }
    }
    if (alive) animId = requestAnimationFrame(drawConfetti);
  }

  // reset taps when returning if replayed
  screens[3].addEventListener('click', () => {
    taps = 0;
    const sz = sizes[0];
    heartSvg.setAttribute('width', sz);
    heartSvg.setAttribute('height', Math.round(sz * 110/120));
    tapCount.textContent = '';
    promptTxt.textContent = 'give it some love ♥';
    goTo(0);
  });
</script>
</body>
</html>
